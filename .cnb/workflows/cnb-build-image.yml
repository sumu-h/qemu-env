# 匹配所有分支名
'**':
  web_trigger_build_image:
    - services:
        - docker
      stages:
        - name: print web param
          script: |
            echo "image_tag=${image_tag}"
            echo "dockerfile=${dockerfile}"
        - name: build image
          script: |
            cd /workspace
            ./build.sh -b
            ./build.sh -p